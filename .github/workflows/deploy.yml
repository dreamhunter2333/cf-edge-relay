name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm run check
      - name: Write deployment configuration
        env:
          WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = process.env.WRANGLER_CONFIG;
          if (!config?.trim()) throw new Error('WRANGLER_CONFIG is required');
          const mask = (value) => {
            if (value.length < 3) return;
            const escaped = value.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::add-mask::${escaped}`);
          };
          for (const match of config.matchAll(/"(?:[^"\\]|\\.)*"/g)) {
            if (config.slice(match.index + match[0].length).trimStart().startsWith(':')) continue;
            const value = JSON.parse(match[0]);
            mask(value);
            try { mask(new URL(value).hostname); } catch {}
          }
          fs.writeFileSync('wrangler.ci.local.jsonc', config, { mode: 0o600, flag: 'wx' });
          NODE
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_LOG: error
        run: pnpm exec wrangler deploy --config wrangler.ci.local.jsonc
      - name: Remove deployment configuration
        if: always()
        run: rm -f wrangler.ci.local.jsonc
