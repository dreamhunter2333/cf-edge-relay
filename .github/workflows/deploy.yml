name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_LOG: none
      WRANGLER_WRITE_LOGS: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm run check
      - name: Deploy default configuration
        shell: sh
        env:
          WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          [ -n "$WRANGLER_CONFIG" ] || exit 0
          : "${CLOUDFLARE_API_TOKEN:?Missing deployment token}"

          umask 077
          trap 'rm -f wrangler.jsonc' EXIT
          printf '%s' "$WRANGLER_CONFIG" > wrangler.jsonc
          unset WRANGLER_CONFIG

          if ! pnpm exec wrangler deploy >/dev/null 2>&1; then
            printf '%s\n' '::error::Default deployment failed'
            exit 1
          fi
          printf '%s\n' 'Default deployment succeeded'
      - name: Deploy additional configurations
        shell: sh
        env:
          WRANGLER_CONFIGS: ${{ secrets.WRANGLER_CONFIGS }}
          CLOUDFLARE_API_TOKENS: ${{ secrets.CLOUDFLARE_API_TOKENS }}
        run: |
          set -eu
          [ -n "$WRANGLER_CONFIGS" ] || exit 0
          keys=$(printf '%s' "$WRANGLER_CONFIGS" |
            jq -r 'if type == "object" then keys[] else error("Expected a configuration object") end')
          [ -n "$keys" ] || exit 0
          : "${CLOUDFLARE_API_TOKENS:?Missing deployment tokens}"

          umask 077
          trap 'rm -f wrangler.jsonc' EXIT

          printf '%s\n' "$keys" | while IFS= read -r service; do
            case "$service" in
              ''|*[!A-Za-z0-9_-]*)
                printf '%s\n' '::error::Invalid service name'
                exit 1
                ;;
            esac

            if ! CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKENS" |
              jq -er --arg key "$service" \
                '.[$key] | select(type == "string" and length > 0)') || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              printf '::error::Missing deployment token (%s)\n' "$service"
              exit 1
            fi
            export CLOUDFLARE_API_TOKEN

            if ! printf '%s' "$WRANGLER_CONFIGS" |
              jq -er --arg key "$service" \
                '.[$key] | if type == "object" then tojson elif type == "string" then select(length > 0) else empty end' > wrangler.jsonc; then
              printf '::error::Invalid deployment configuration (%s)\n' "$service"
              exit 1
            fi

            if ! (unset WRANGLER_CONFIGS CLOUDFLARE_API_TOKENS; pnpm exec wrangler deploy) >/dev/null 2>&1; then
              printf '::error::Deployment failed (%s)\n' "$service"
              exit 1
            fi
            printf 'Deployment succeeded (%s)\n' "$service"
          done
      - name: Remove deployment configuration
        if: always()
        run: rm -f wrangler.jsonc
