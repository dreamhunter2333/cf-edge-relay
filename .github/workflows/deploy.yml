name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_LOG: none
      WRANGLER_WRITE_LOGS: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm run check
      - name: Deploy default configuration
        shell: sh
        env:
          WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          [ -n "$WRANGLER_CONFIG" ] || exit 0
          : "${CLOUDFLARE_API_TOKEN:?Missing deployment token}"

          umask 077
          trap 'rm -f wrangler.jsonc' EXIT
          printf '%s' "$WRANGLER_CONFIG" > wrangler.jsonc
          unset WRANGLER_CONFIG

          if ! pnpm exec wrangler deploy >/dev/null 2>&1; then
            printf '%s\n' '::error::Default deployment failed'
            exit 1
          fi
          printf '%s\n' 'Default deployment succeeded'
      - name: Deploy suffixed configurations
        shell: sh
        env:
          DEPLOY_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -eu
          umask 077
          trap 'rm -f wrangler.jsonc' EXIT

          keys=$(printf '%s' "$DEPLOY_SECRETS" |
            jq -r 'keys[] | select(test("^WRANGLER_CONFIG_.+$"))')
          [ -n "$keys" ] || exit 0

          printf '%s\n' "$keys" | while IFS= read -r key; do
            suffix="${key#WRANGLER_CONFIG_}"
            if ! CLOUDFLARE_API_TOKEN=$(printf '%s' "$DEPLOY_SECRETS" |
              jq -er --arg key "CLOUDFLARE_API_TOKEN_$suffix" \
                '.[$key] | select(length > 0)'); then
              printf '::error::Missing deployment token (%s)\n' "$suffix"
              exit 1
            fi
            export CLOUDFLARE_API_TOKEN

            if ! printf '%s' "$DEPLOY_SECRETS" |
              jq -er --arg key "$key" \
                '.[$key] | select(length > 0)' > wrangler.jsonc; then
              printf '::error::Empty deployment configuration (%s)\n' "$suffix"
              exit 1
            fi

            if ! (unset DEPLOY_SECRETS; pnpm exec wrangler deploy) >/dev/null 2>&1; then
              printf '::error::Deployment failed (%s)\n' "$suffix"
              exit 1
            fi
            printf 'Deployment succeeded (%s)\n' "$suffix"
          done
      - name: Remove deployment configuration
        if: always()
        run: rm -f wrangler.jsonc
